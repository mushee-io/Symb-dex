name: Dependency Advisory Evidence

on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-advisories.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-advisories.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies without running arbitrary lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture npm advisory evidence (nonblocking, NOT release approval)
        shell: bash
        run: |
          npm audit --json > npm-security-report.json || true
          node -e 'const fs=require("fs");let d=JSON.parse(fs.readFileSync("npm-security-report.json"));if(!d.metadata||!d.metadata.vulnerabilities)process.exit(1);let v=d.metadata.vulnerabilities;console.log("Dependency advisory totals:",JSON.stringify(v)); if((v.high||0)+(v.critical||0)>0) console.log("RELEASE BLOCKER: high/critical advisories require owner triage and remediation.")'
      - name: Archive package-by-package advisory findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-advisories
          path: npm-security-report.json
          if-no-files-found: error
          retention-days: 30
