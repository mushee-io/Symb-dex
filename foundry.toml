[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "out"
libs = []
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
fuzz = { runs = 256 }
invariant = { runs = 128, depth = 40, fail_on_revert = false }
fs_permissions = []

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[fmt]
line_length = 120
