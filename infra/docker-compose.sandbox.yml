# Centralized valueless EVM sandbox with durable state volume. Not decentralized consensus.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    restart: unless-stopped
    entrypoint: ["anvil"]
    command: ["--chain-id","${SANDBOX_CHAIN_ID:?Set a distinct test chain ID}","--host","0.0.0.0","--port","8545","--block-time","2","--state","/data/anvil.json","--state-interval","30","--preserve-historical-states","--silent"]
    expose: ["8545"]
    volumes: [sandbox_chain_data:/data]
    networks: [isolated]
    healthcheck:
      test: ["CMD","cast","chain-id","--rpc-url","http://127.0.0.1:8545"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: infra/rpc-gateway/Dockerfile
    restart: unless-stopped
    environment:
      ANVIL_INTERNAL_URL: "http://anvil:8545"
      GATEWAY_PORT: "8080"
      RPC_ALLOWED_ORIGINS: "${RPC_ALLOWED_ORIGINS:?HTTPS frontend origin is required}"
      RPC_REQUESTS_PER_MINUTE: "${RPC_REQUESTS_PER_MINUTE:-120}"
    depends_on:
      anvil:
        condition: service_healthy
    expose: ["8080"]
    networks: [isolated, public]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RPC_HOSTNAME: "${RPC_HOSTNAME:?Real hostname is required for automatic TLS}"
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sandbox_caddy_data:/data
      - sandbox_caddy_config:/config
    depends_on: [gateway]
    networks: [public]

  indexer:
    profiles: ["indexer"]
    build:
      context: ..
      dockerfile: infra/indexer.Dockerfile
    restart: unless-stopped
    environment:
      TESTNET_DATABASE_URL: "${TESTNET_DATABASE_URL:?Use dedicated Neon testnet indexer database}"
      TESTNET_INDEXER_START_BLOCK: "${TESTNET_INDEXER_START_BLOCK:?Real Factory deployment block needed}"
      TESTNET_INDEXER_CONFIRMATIONS: "${TESTNET_INDEXER_CONFIRMATIONS:-3}"
      TESTNET_INDEXER_BATCH_SIZE: "${TESTNET_INDEXER_BATCH_SIZE:-25}"
      TESTNET_INDEXER_MAX_WINDOWS: "${TESTNET_INDEXER_MAX_WINDOWS:-15}"
      TESTNET_INDEXER_POLL_SECONDS: "${TESTNET_INDEXER_POLL_SECONDS:-10}"
    volumes:
      - ../config/networks.testnet.json:/app/config/networks.testnet.json:ro
      - ../config/deployments.testnet.json:/app/config/deployments.testnet.json:ro
    networks: [isolated,public]
    depends_on:
      anvil:
        condition: service_healthy

volumes:
  sandbox_chain_data:
  sandbox_caddy_data:
  sandbox_caddy_config:

networks:
  isolated:
    internal: true
  public: {}
